version: "3.8"

services:
  mongodb-primary:
    image: mongo:6.0
    container_name: werewolf-mongodb-primary
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_primary_data:/data/db
      - ./init-replica.js:/docker-entrypoint-initdb.d/init-replica.js:ro
      - ./init-users.js:/docker-entrypoint-initdb.d/init-users.js:ro
      - ./init-collections.js:/docker-entrypoint-initdb.d/init-collections.js:ro
    networks:
      - werewolf-network
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

  mongodb-secondary-1:
    image: mongo:6.0
    container_name: werewolf-mongodb-secondary-1
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "27018:27017"
    volumes:
      - mongodb_secondary1_data:/data/db
    networks:
      - werewolf-network
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    depends_on:
      - mongodb-primary

  mongodb-secondary-2:
    image: mongo:6.0
    container_name: werewolf-mongodb-secondary-2
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "27019:27017"
    volumes:
      - mongodb_secondary2_data:/data/db
    networks:
      - werewolf-network
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    depends_on:
      - mongodb-primary

volumes:
  mongodb_primary_data:
    driver: local
  mongodb_secondary1_data:
    driver: local
  mongodb_secondary2_data:
    driver: local
networks:
  werewolf-network:
    driver: bridge
