# nginx設定ファイル
# /etc/nginx/nginx.conf または /etc/nginx/conf.d/werewolf-app.conf

server {
    listen 80;
    server_name 54.199.89.153;  # あなたのEC2インスタンスのIPアドレス

    # フロントエンド（React/Vite）の静的ファイル配信
    location / {
        root /var/www/werewolf-app/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # バックエンドAPIへのプロキシ
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket接続（Socket.IO）へのプロキシ
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # ログ設定
    access_log /var/log/nginx/werewolf-app-access.log;
    error_log /var/log/nginx/werewolf-app-error.log;
} 